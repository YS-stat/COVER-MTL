[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cover-mtl"
version = "0.1.0"
description = "Covariate-overlap regularized multi-task learning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "scikit-learn>=1.2",
  "torch>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
plot = ["matplotlib>=3.7"]
real-data = [
  "lxml>=4.9",
  "pyarrow>=12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
